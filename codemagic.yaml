workflows:
  android-workflow:
    name: Herencia Android APK Build
    max_build_duration: 30
    instance_type: linux
    environment:
      flutter: stable
      java: 17
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: '*'
          include: true
          source: true
    scripts:
      - name: Obtener dependencias de Flutter
        script: flutter packages pub get
      - name: Compilar APK Release de Android
        script: flutter build apk --release
    artifacts:
      - build/**/outputs/**/*.apk

  web-workflow:
    name: Herencia Web Build
    max_build_duration: 20
    instance_type: linux
    environment:
      flutter: stable
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: '*'
          include: true
          source: true
    scripts:
      - name: Obtener dependencias
        script: flutter packages pub get
      - name: Compilar Flutter Web
        script: flutter build web --release
    artifacts:
      - build/web/**
